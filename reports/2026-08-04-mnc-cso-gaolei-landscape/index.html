<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07182b"><title>MNC的CSO管理心得和实践｜高磊</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07182b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}.stage{height:100%;display:grid;place-items:center}.slide{display:none;width:100vw;height:100vh;align-items:center;justify-content:center}.slide.active{display:flex}.slide img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;aspect-ratio:16/9;object-fit:contain;background:#fff;box-shadow:0 8px 40px #0008}.controls{position:fixed;inset:auto 0 max(10px,env(safe-area-inset-bottom)) 0;display:flex;align-items:center;justify-content:center;gap:12px;z-index:10;transition:opacity .3s}.controls.hidden{opacity:0;pointer-events:none}.btn{border:1px solid #ffffff33;background:#07182bcc;color:white;border-radius:999px;min-width:44px;height:44px;padding:0 15px;backdrop-filter:blur(12px);cursor:pointer}.counter{font-size:13px;background:#07182bcc;border:1px solid #ffffff22;border-radius:999px;padding:7px 13px}.hint{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);font-size:12px;color:#dce8f5;background:#07182bcc;padding:7px 12px;border-radius:999px;z-index:10;transition:opacity .4s}.hint.hide{opacity:0}.rotate{display:none;position:fixed;inset:0;z-index:30;background:#07182b;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.8}.rotate b{display:block;font-size:22px;margin-bottom:8px}@media (orientation:portrait) and (max-width:900px){.rotate{display:flex}.stage,.controls,.hint{visibility:hidden}}@media (orientation:landscape){.slide img{width:100vw;height:100vh}}@media print{html,body{overflow:visible;background:white}.slide{display:flex!important;break-after:page;width:100vw;height:100vh}.controls,.hint,.rotate{display:none!important}}
</style></head><body><main class="stage" id="stage"><section class="slide active" data-index="1"><img src="assets/slide-01.jpg" alt="第1页" loading="eager" draggable="false"></section><section class="slide" data-index="2"><img src="assets/slide-02.jpg" alt="第2页" loading="eager" draggable="false"></section><section class="slide" data-index="3"><img src="assets/slide-03.jpg" alt="第3页" loading="lazy" draggable="false"></section><section class="slide" data-index="4"><img src="assets/slide-04.jpg" alt="第4页" loading="lazy" draggable="false"></section><section class="slide" data-index="5"><img src="assets/slide-05.jpg" alt="第5页" loading="lazy" draggable="false"></section><section class="slide" data-index="6"><img src="assets/slide-06.jpg" alt="第6页" loading="lazy" draggable="false"></section><section class="slide" data-index="7"><img src="assets/slide-07.jpg" alt="第7页" loading="lazy" draggable="false"></section><section class="slide" data-index="8"><img src="assets/slide-08.jpg" alt="第8页" loading="lazy" draggable="false"></section><section class="slide" data-index="9"><img src="assets/slide-09.jpg" alt="第9页" loading="lazy" draggable="false"></section><section class="slide" data-index="10"><img src="assets/slide-10.jpg" alt="第10页" loading="lazy" draggable="false"></section><section class="slide" data-index="11"><img src="assets/slide-11.jpg" alt="第11页" loading="lazy" draggable="false"></section><section class="slide" data-index="12"><img src="assets/slide-12.jpg" alt="第12页" loading="lazy" draggable="false"></section><section class="slide" data-index="13"><img src="assets/slide-13.jpg" alt="第13页" loading="lazy" draggable="false"></section><section class="slide" data-index="14"><img src="assets/slide-14.jpg" alt="第14页" loading="lazy" draggable="false"></section><section class="slide" data-index="15"><img src="assets/slide-15.jpg" alt="第15页" loading="lazy" draggable="false"></section><section class="slide" data-index="16"><img src="assets/slide-16.jpg" alt="第16页" loading="lazy" draggable="false"></section><section class="slide" data-index="17"><img src="assets/slide-17.jpg" alt="第17页" loading="lazy" draggable="false"></section><section class="slide" data-index="18"><img src="assets/slide-18.jpg" alt="第18页" loading="lazy" draggable="false"></section><section class="slide" data-index="19"><img src="assets/slide-19.jpg" alt="第19页" loading="lazy" draggable="false"></section><section class="slide" data-index="20"><img src="assets/slide-20.jpg" alt="第20页" loading="lazy" draggable="false"></section><section class="slide" data-index="21"><img src="assets/slide-21.jpg" alt="第21页" loading="lazy" draggable="false"></section><section class="slide" data-index="22"><img src="assets/slide-22.jpg" alt="第22页" loading="lazy" draggable="false"></section><section class="slide" data-index="23"><img src="assets/slide-23.jpg" alt="第23页" loading="lazy" draggable="false"></section></main>
<div class="hint" id="hint">横屏观看 · 左右滑动翻页 · 双击进入全屏</div><nav class="controls" id="controls"><button class="btn" id="prev" aria-label="上一页">‹</button><span class="counter"><b id="current">1</b> / 23</span><button class="btn" id="next" aria-label="下一页">›</button><button class="btn" id="full" aria-label="全屏">全屏</button></nav><div class="rotate"><div><b>请旋转手机至横屏</b>横屏后即可全屏播放</div></div>
<script>
const slides=[...document.querySelectorAll('.slide')],cur=document.getElementById('current'),controls=document.getElementById('controls'),hint=document.getElementById('hint');let n=0,startX=0,timer;
function show(i){n=(i+slides.length)%slides.length;slides.forEach((s,j)=>s.classList.toggle('active',j===n));cur.textContent=n+1;history.replaceState(null,'','#'+(n+1));wake();}
function wake(){controls.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>controls.classList.add('hidden'),2600)}
document.getElementById('prev').onclick=()=>show(n-1);document.getElementById('next').onclick=()=>show(n+1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))show(n+1);if(['ArrowLeft','PageUp'].includes(e.key))show(n-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;wake()},{passive:true});addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)show(n+(d<0?1:-1))},{passive:true});
document.getElementById('stage').ondblclick=()=>document.documentElement.requestFullscreen?.();document.body.onclick=wake;setTimeout(()=>hint.classList.add('hide'),4000);let h=parseInt(location.hash.slice(1));if(h>=1&&h<=slides.length)show(h-1);
</script></body></html>
